[project]
name = "iassistpro"
version = "0.1.0"
description = "Generic voice mock-interviewer service (Pipecat, local speech, Claude)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pipecat-ai[anthropic,kokoro,piper,silero,whisper,webrtc,websocket]==1.15.0",
    "aiortc==1.15.0",
    "aioice==0.12.1",
    "faster-whisper==1.2.1",
    "piper-tts==1.8.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5",
    "loguru>=0.7",
    "soundfile>=0.13",
    "soxr>=0.5",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iassistpro"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["slow: slow tests (model downloads, real speech); run with -m slow"]
addopts = "-m 'not slow'"
